<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>thestAIwart</title>
</head>
<body bgcolor="#DDEEDD">

<h2 align="center">thestAIwart</h2>

<p align="center"><i>An LLM trained on 18 years of Joe Weisenthal tweets.<br>
Nothing here is from him or should be attributed to him.</i></p>

<hr>

<div id="chatlog"></div>

<form id="chatform">
<p>
<textarea id="msg" rows="6" cols="72" maxlength="8000" autofocus placeholder="Paste a headline, an article, or just say something"></textarea>
<br>
<input type="submit" value="Ask">
</p>
</form>

<p id="status"><i></i></p>

<hr>

<p><a href="/">&#8592; back to Joe's home page</a> <span id="health" style="float:right"><i>checking robot&hellip;</i></span></p>

<script>
var ENDPOINT = "https://jnathan--stalwart-voice-serve-chat-web.modal.run";
var chatHistory = [];

// page v4 - on-load health check so problems name themselves
(function () {
  var h = document.getElementById("health");
  fetch(ENDPOINT, { method: "GET" })
    .then(function (r) { return r.json(); })
    .then(function () { h.innerHTML = "<i>robot: reachable (v4)</i>"; })
    .catch(function (err) { h.innerHTML = "<i>robot: UNreachable (v4) &mdash; " + err.name + ": " + err.message + "</i>"; });
})();

// Enter sends; Shift+Enter makes a new line
document.getElementById("msg").addEventListener("keydown", function (e) {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    document.getElementById("chatform").dispatchEvent(new Event("submit", { cancelable: true }));
  }
});

function addLine(who, text) {
  var p = document.createElement("p");
  var b = document.createElement("b");
  b.textContent = who + ": ";
  p.appendChild(b);
  p.appendChild(document.createTextNode(text));
  document.getElementById("chatlog").appendChild(p);
  p.scrollIntoView();
}

document.getElementById("chatform").onsubmit = function (e) {
  e.preventDefault();
  var box = document.getElementById("msg");
  var msg = box.value.trim();
  if (!msg) return;
  box.value = "";
  addLine("You", msg);
  var status = document.getElementById("status");
  if (ENDPOINT.indexOf("__") === 0) {
    status.innerHTML = "<i>the robot isn't plugged in yet &mdash; check back soon</i>";
    return;
  }
  status.innerHTML = "<i>thinking&hellip; (if the robot was asleep, waking it up can take a minute)</i>";

  function attempt(triesLeft) {
    fetch(ENDPOINT, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: msg, history: chatHistory })
    })
    .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
    .then(function (data) {
      status.innerHTML = "";
      addLine("thestAIwart", data.reply);
      chatHistory.push({ role: "user", content: msg });
      chatHistory.push({ role: "assistant", content: data.reply });
      chatHistory = chatHistory.slice(-8);
    })
    .catch(function (err) {
      if (triesLeft > 0) {
        status.innerHTML = "<i>connection hiccup &mdash; retrying&hellip;</i>";
        setTimeout(function () { attempt(triesLeft - 1); }, 4000);
      } else {
        status.innerHTML = "<i>something broke: " + err.message + " &mdash; try again in a minute</i>";
      }
    });
  }
  attempt(2);
};
</script>

</body>
</html>
